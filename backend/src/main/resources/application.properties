# ===================================================================
# FUNewsManagementSystem - Application Configuration (Stage 2)
# ===================================================================

# Application Info
spring.application.name=FUNewsManagementSystem
server.port=8080

# Logging
logging.level.com.fu.news=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# Microsoft SQL Server Configuration
# ===================================================================
# Kết nối SQL Server thông qua biến môi trường (hoặc dùng giá trị mặc định)
# Cách 1: Thiết lập biến môi trường DB_PASSWORD trước khi chạy:
#   PowerShell: $env:DB_PASSWORD="your_password"
#   CMD:        set DB_PASSWORD=your_password
# Cách 2: Sao chép file 'application-local.properties.example' thành
#   'application-local.properties' và chạy với profile: --spring.profiles.active=local
# ===================================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:FUNewsManagement};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:THGaming809}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# Spring Data JPA & Hibernate Configuration
# ===================================================================
# ddl-auto=none: Tôn trọng file script 01_schema.sql đã chạy trên SQL Server.
# Tuyệt đối không dùng create/create-drop để tránh xóa mất dữ liệu khi restart.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
